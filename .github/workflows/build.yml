name: build

# Builds the binary and publishes it.
#
# The install script pins the SHA-256 of the binary it installs, so a
# release is not finished until that pin moves - which is why the job opens
# a pull request with the new hash rather than pushing it. The pin is the
# trust anchor: it is what makes "this is the binary the script was
# written for" checkable, and it should only move when a person says so.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MUSL: x86_64-unknown-linux-musl
  ARM: aarch64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add $MUSL $ARM
          rustc --version && cargo --version

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build
        run: |
          mkdir -p dist
          # Both builds are musl and static: no glibc, no interpreter, one
          # file that runs anywhere a Linux kernel does. The aarch64 build
          # uses Rust's own linker, so no cross-toolchain is needed.
          #
          # The tag is stamped into the binary, so `ai-gateway-proxy version`
          # on an installed node says WHICH release it is - otherwise every
          # release reports the same version and nobody can tell.
          VERSION="${GITHUB_REF_NAME#v}"
          export AI_GATEWAY_PROXY_VERSION="$VERSION"
          cargo build --release --target $MUSL
          cp target/$MUSL/release/ai-gateway-proxy dist/ai-gateway-proxy-linux-amd64
          RUSTFLAGS="-C linker=rust-lld" cargo build --release --target $ARM
          cp target/$ARM/release/ai-gateway-proxy dist/ai-gateway-proxy-linux-arm64

      - name: Checksums
        run: |
          cd dist
          sha256sum ai-gateway-proxy-linux-* > SHA256SUMS
          for f in ai-gateway-proxy-linux-*; do
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          done
          cat SHA256SUMS

      - name: Publish the release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          files: |
            dist/ai-gateway-proxy-linux-amd64
            dist/ai-gateway-proxy-linux-amd64.sha256
            dist/ai-gateway-proxy-linux-arm64
            dist/ai-gateway-proxy-linux-arm64.sha256
            dist/SHA256SUMS
          body: |
            The node binary, and the checksum for each of them.

            The installer fetches the latest release and checks the binary
            against the `.sha256` published beside it, so a download that
            did not arrive intact is not run.
